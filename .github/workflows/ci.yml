name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein überholter Lauf auf demselben Branch wird abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typen, Daten, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Kein `cache: npm`: setup-node bricht ohne Lockfile ab, und zwar
      # bevor der Fallback unten greift. Sobald package-lock.json im Repo
      # liegt, `cache: npm` hier wieder ergaenzen — dann spart es Zeit.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm ci` braucht ebenfalls ein Lockfile. Solange keines committet
      # ist, greift `npm install` — sonst wäre der erste Lauf rot, ohne dass
      # etwas kaputt ist. Sobald das Lockfile da ist, gilt automatisch der
      # reproduzierbare Pfad.
      - name: Abhängigkeiten
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Kein package-lock.json im Repo — es läuft 'npm install' statt 'npm ci'. Lockfile committen für reproduzierbare Builds."
            npm install --no-audit --no-fund
          fi

      # Erzeugt .astro/types.d.ts für die Content-Collections; ohne das
      # kennt astro check die Typen der Datenfiles nicht.
      - name: Astro sync
        run: npx astro sync

      - name: Astro check
        run: npm run check

      - name: Endpoint-Syntax
        run: npm run check:php

      # Der Endpoint ist der einzige Teil mit echter Logik. 19 Fälle gegen
      # PHPs eingebauten Server: Validierung, Honeypot, Double-Opt-In,
      # Replay-Schutz, gefälschte Signatur, Rate-Limit, Locale-Zuordnung.
      - name: Endpoint-Verhalten
        run: npm run test:endpoint

      # Prüft die zugesagten Projektfakten: 278 Mietwohnungen, 17 Baubereiche,
      # 3–8 Vollgeschosse, autofrei, keine Mietpreise, kein Vermietungsstart.
      # Bricht ab, wenn eine davon verletzt wird.
      - name: Projektfakten
        run: npm run check:data

      - name: Build
        run: npm run build

      - name: Ausgabe prüfen
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/robots.txt
          # Genau die Pfade, auf die ErrorDocument in der .htaccess zeigt.
          test -f dist/404.html
          test -f dist/en/404/index.html
          test -f dist/.htaccess
          test -f dist/api/anmeldung.php
          test -f dist/api/bestaetigen.php
          # Die @font-face-Regel liegt in public/ und muss mitkommen.
          test -f dist/fonts/readex-pro.css
          echo "Erzeugte Seiten:"
          find dist -name '*.html' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  fonts:
    name: Schriften abrufbar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Nur dieser Schritt darf scheitern, ohne den PR zu blockieren:
      # Google Fonts ist ein externer Dienst. `continue-on-error` gehoert
      # deshalb hierhin und nicht an den Job — job-weit wuerde es auch die
      # Pruefung unten verschlucken und einen echten Fehler gruen melden.
      - name: Readex Pro holen
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-fonts.mjs

      # Ein Dedup-Fehler dagegen muss den Lauf roeten — also ohne
      # continue-on-error, und nur wenn der Download ueberhaupt klappte.
      - name: Schnitte prüfen
        if: steps.fetch.outcome == 'success'
        run: |
          ls -la public/fonts/
          test -s public/fonts/readex-pro-variable.woff2
          # Identische Checksummen heissen: dieselbe Datei mehrfach geladen.
          # Genau das war der Fehler, den diese Prüfung fernhalten soll.
          dupes=$(sha256sum public/fonts/*.woff2 | awk '{print $1}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Mehrere woff2-Dateien sind byte-identisch — Deduplizierung im Font-Skript kaputt."
            sha256sum public/fonts/*.woff2
            exit 1
          fi
