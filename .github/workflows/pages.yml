name: Vorschau

# Statische Vorschau auf GitHub Pages. Sie ersetzt das Deployment nicht:
# produktiv laeuft die Site auf klassischem PHP-Hosting, und dort auch das
# Anmeldeformular. Auf Pages laeuft kein PHP, der Endpoint ist dort also
# ohne Funktion — das Formular sagt es selbst (features.staticPreview).
on:
  workflow_dispatch:
  push:
    branches: [main, claude/new-session-1fphb2]

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig, und laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Vorschau veröffentlichen
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Kein enablement: true. Pages per API anzulegen ist eine
      # Admin-Operation, die der GITHUB_TOKEN eines Workflows nicht darf —
      # der permissions-Block kann Rechte nur einschraenken, nie hinzufuegen.
      # Pages muss einmal von Hand eingeschaltet werden:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # Danach laeuft dieser Workflow ohne weiteres Zutun.
      #
      # Die Action liefert Origin und Basispfad als Outputs; beides geht unten
      # in den Build, statt hier verdrahtet zu werden.
      - name: Pages einrichten
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      # Ohne diesen Schritt scheitert der Lauf mit "Get Pages site failed:
      # Not Found" — richtig, aber nicht handlungsleitend.
      - name: Voraussetzung prüfen
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error title=GitHub Pages ist nicht eingeschaltet::\
          Einmalig setzen: Settings -> Pages -> Build and deployment -> \
          Source: GitHub Actions. Danach diesen Workflow erneut starten \
          (Actions -> Vorschau -> Run workflow). Ein Workflow-Token darf \
          Pages nicht selbst anlegen."
          exit 1

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Schriften
        run: npm run fonts

      - name: Build für den Unterpfad
        run: npm run build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          STATIC_PREVIEW: 'true'

      # Nachweis, dass der Basispfad tatsaechlich in den Links steht. Ohne
      # das faellt eine kaputte Vorschau erst beim Klicken auf.
      - name: Basispfad prüfen
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          echo "Basispfad: ${base:-/}"
          if [ -n "$base" ] && [ "$base" != "/" ]; then
            grep -q "href=\"${base}/architektur\"" dist/index.html \
              || { echo "::error::Navigation traegt den Basispfad nicht"; exit 1; }
            grep -q "href=\"${base}/fonts/readex-pro.css\"" dist/index.html \
              || { echo "::error::Schrift-Stylesheet traegt den Basispfad nicht"; exit 1; }
            grep -q "action=\"${base}/api/anmeldung.php\"" dist/anmeldung/index.html \
              || { echo "::error::Formular-Action traegt den Basispfad nicht"; exit 1; }
          fi
          grep -q 'name="robots" content="noindex' dist/index.html \
            || { echo "::error::Vorschau ohne noindex"; exit 1; }
          grep -q 'Disallow: /' dist/robots.txt \
            || { echo "::error::robots.txt sperrt die Vorschau nicht"; exit 1; }
          echo "Basispfad, noindex und robots.txt in Ordnung."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URL
        run: echo "::notice::Vorschau unter ${{ steps.deployment.outputs.page_url }}"
