# Cloudflare Pages. Der Astro-Build liefert `dist/`, die Functions in
# `functions/` werden von Pages automatisch als Routen unter /api/ montiert.
name = "birkenhain"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# KV traegt Rate-Limit-Zaehler, offene und bestaetigte Anmeldungen.
[[kv_namespaces]]
binding = "BIRKENHAIN_KV"
id = "e5848e0d0f3249f982903dc38013f7a2"

[vars]
MAIL_PROVIDER = "resend"
PUBLIC_SITE_ORIGIN = "https://im-birkenhain.ch"

# MAIL_API_KEY, MAIL_FROM, MAIL_NOTIFY_TO und OPT_IN_SECRET sind Secrets und
# gehoeren nicht hierher:
#   wrangler pages secret put OPT_IN_SECRET
